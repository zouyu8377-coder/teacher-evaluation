spring:
  datasource:
    url: jdbc:h2:mem:teacher_eval_test
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 5
      
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  h2:
    console:
      enabled: true
      path: /h2-console
      
  # 禁用Redis和MinIO依赖
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  
# 禁用MinIO配置
minio:
  enabled: false
  endpoint: http://localhost:19000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket-name: teacher-eval-test
  
# JWT配置
jwt:
  secret: teacher-eval-secret-key-2024-long-enough-for-security
  expiration: 86400000

# 日志配置
logging:
  level:
    com.school.teacherEval: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    
# 服务器配置
server:
  port: ${APP_BACKEND_PORT:18083}

app:
  seed-data:
    enabled: true
