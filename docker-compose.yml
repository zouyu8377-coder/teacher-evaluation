version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: teacher-eval-mysql
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: teacher_eval
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - teacher-eval-network

  redis:
    image: redis:7-alpine
    container_name: teacher-eval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - teacher-eval-network

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: teacher-eval-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - teacher-eval-network

  backend:
    image: teacher-eval-backend:1.4.3
    container_name: teacher-eval-backend-new
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/teacher_eval?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      DB_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: teacher-eval
      JWT_SECRET: your-jwt-secret-key-here-change-in-production
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - teacher-eval-network

  frontend:
    image: teacher-eval-frontend:1.4.3
    container_name: teacher-eval-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - teacher-eval-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  teacher-eval-network:
    driver: bridge
