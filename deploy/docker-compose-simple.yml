version: "3.3"

services:
  mysql:
    image: teacher-eval-cn-beijing.cr.volces.com/teacher-eval/mysql:8.0
    container_name: teacher-eval-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: teacher_eval
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: teacher-eval-cn-beijing.cr.volces.com/teacher-eval/redis:7-alpine
    container_name: teacher-eval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  minio:
    image: teacher-eval-cn-beijing.cr.volces.com/teacher-eval/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: teacher-eval-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"

  backend:
    image: teacher-eval-cn-beijing.cr.volces.com/teacher-eval/teacher-eval-backend:1.001
    container_name: teacher-eval-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/teacher_eval?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: teacher-eval
    depends_on:
      - mysql
      - redis
      - minio

  frontend:
    image: teacher-eval-cn-beijing.cr.volces.com/teacher-eval/teacher-eval-frontend:1.001
    container_name: teacher-eval-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend